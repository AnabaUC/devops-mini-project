apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-mini-app.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: {{ include "devops-mini-app.name" . }}}
  template:
    metadata:
      labels: {app: {{ include "devops-mini-app.name" . }}}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {{- toYaml .Values.resources | nindent 12 }}
